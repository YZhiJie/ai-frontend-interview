<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.03</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">Canvas vs SVG</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">AI 前端面试漫画 · NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：一万条曲线之选</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">大屏要画一万条实时曲线，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">到底用 SVG 还是 Canvas？</text>
    <g transform="translate(52,196)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,177 74,183 88,189" fill="#f8fafc"/>
    <rect x="88" y="168" width="320" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="190" font-size="15" fill="#0b1220">先问数量、交互、缩放。</text>
    <rect x="24" y="214" width="524" height="76" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="236" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 10,000 条曲线 × 60fps 实时刷新</text>
    <text x="38" y="254" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// SVG：一万条 path = 一万个节点</text>
    <text x="38" y="272" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// Canvas：点击命中谁来管？</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">选型不是玄学，</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">是三个维度的权衡题。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">原理：对象派 vs 像素派</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="340" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">一个管「对象」，一个管「像素」。</text>
    <rect x="24" y="134" width="254" height="170" rx="10" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="40" y="160" font-size="14" font-weight="bold" fill="#22d3ee">SVG · 对象派</text>
    <text x="40" y="186" font-size="12" fill="#cbd5e1">· DOM 图元，节点即元素</text>
    <text x="40" y="208" font-size="12" fill="#cbd5e1">· 事件监听开箱即用</text>
    <text x="40" y="230" font-size="12" fill="#cbd5e1">· CSS 动画、滤镜直接用</text>
    <text x="40" y="252" font-size="12" fill="#94a3b8">· 节点一多就变卡</text>
    <text x="40" y="274" font-size="12" fill="#94a3b8">· 适合图标、图表、地图</text>
    <rect x="294" y="134" width="254" height="170" rx="10" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="310" y="160" font-size="14" font-weight="bold" fill="#f97316">Canvas · 像素派</text>
    <text x="310" y="186" font-size="12" fill="#cbd5e1">· 像素绘制，画完即忘</text>
    <text x="310" y="208" font-size="12" fill="#cbd5e1">· 高频重绘性能好</text>
    <text x="310" y="230" font-size="12" fill="#cbd5e1">· 命中检测要自己算</text>
    <text x="310" y="252" font-size="12" fill="#94a3b8">· 文本、缩放要手动处理</text>
    <text x="310" y="274" font-size="12" fill="#94a3b8">· 适合粒子、海量图形</text>
    <rect x="24" y="316" width="524" height="40" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="316" width="4" height="40" rx="2" fill="#22d3ee"/>
    <text x="40" y="341" font-size="13.5" fill="#e2e8f0">SVG 慢在 DOM，Canvas 苦在交互。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：选型矩阵</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">直接上表格，抄作业。</text>
    <rect x="24" y="134" width="524" height="196" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <text x="90" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#94a3b8">维度</text>
    <text x="246" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22d3ee">SVG</text>
    <text x="447" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f97316">Canvas</text>
    <line x1="24" y1="164" x2="548" y2="164" stroke="#223055"/>
    <line x1="156" y1="134" x2="156" y2="330" stroke="#223055"/>
    <line x1="336" y1="134" x2="336" y2="330" stroke="#223055"/>
    <text x="40" y="191" font-size="13" font-weight="bold" fill="#e2e8f0">图形数量</text>
    <text x="168" y="191" font-size="12" fill="#cbd5e1">少而精，上千即重</text>
    <text x="348" y="191" font-size="12" fill="#94a3b8">上万条也扛得住</text>
    <line x1="24" y1="206" x2="548" y2="206" stroke="#223055"/>
    <text x="40" y="233" font-size="13" font-weight="bold" fill="#e2e8f0">交互频率</text>
    <text x="168" y="233" font-size="12" fill="#cbd5e1">原生事件，省心</text>
    <text x="348" y="233" font-size="12" fill="#94a3b8">自己算命中检测</text>
    <line x1="24" y1="248" x2="548" y2="248" stroke="#223055"/>
    <text x="40" y="275" font-size="13" font-weight="bold" fill="#e2e8f0">缩放需求</text>
    <text x="168" y="275" font-size="12" fill="#cbd5e1">矢量无损缩放</text>
    <text x="348" y="275" font-size="12" fill="#94a3b8">位图放大发糊</text>
    <line x1="24" y1="290" x2="548" y2="290" stroke="#223055"/>
    <text x="40" y="317" font-size="13" font-weight="bold" fill="#e2e8f0">开发成本</text>
    <text x="168" y="317" font-size="12" fill="#cbd5e1">低，声明式</text>
    <text x="348" y="317" font-size="12" fill="#94a3b8">高，命令式手刷</text>
    <text x="286" y="350" text-anchor="middle" font-size="12" fill="#94a3b8">按 数量 × 交互 × 缩放 打分，结论自现</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：混搭才是答案</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">高手都是混着用的。</text>
    <rect x="24" y="146" width="250" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="163" font-size="11.5" font-weight="bold" fill="#f97316">坑：SVG 改属性会触发 DOM 重排</text>
    <text x="38" y="192" font-size="12" fill="#94a3b8">高频动画走 transform/opacity 通道</text>
    <rect x="24" y="212" width="240" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="229" font-size="11.5" font-weight="bold" fill="#f97316">坑：Canvas 高频重绘要 rAF 节流</text>
    <text x="38" y="258" font-size="12" fill="#94a3b8">把绘制集中进 rAF，一帧只画一次</text>
    <rect x="24" y="286" width="524" height="66" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="66" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.5" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="40" y="328" font-size="13.5" fill="#e2e8f0">大数量用 Canvas/WebGL，少而需交互用 SVG；</text>
    <text x="40" y="346" font-size="13.5" fill="#94a3b8">复杂大屏可以混合，各画各的层。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · ai-frontend-interview · EP.03</text>
</svg>
