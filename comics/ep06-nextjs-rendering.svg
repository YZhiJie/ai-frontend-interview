<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.06</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">SSR/SSG/ISR 选型</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">AI 前端面试漫画 · NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：快与新难两全</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="330" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">纯 SSR 首屏要等接口，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">纯 SSG 的价格又总是过时。</text>
    <g transform="translate(52,196)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,177 74,183 88,189" fill="#f8fafc"/>
    <rect x="88" y="168" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="190" font-size="15" fill="#0b1220">静态与动态，不是单选题。</text>
    <rect x="24" y="214" width="524" height="76" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="236" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">getStaticProps     // 构建时生成</text>
    <text x="38" y="254" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">getServerSideProps // 每请求渲染</text>
    <text x="38" y="272" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">revalidate: 60     // ISR 定时再生</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">快与新不必二选一，</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">增量再生的 ISR 正是答案。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">原理：三栏对比</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">三种渲染，各管一段。</text>
    <rect x="24" y="134" width="160" height="128" rx="10" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="104" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#22d3ee">SSR</text>
    <line x1="40" y1="166" x2="168" y2="166" stroke="#1e2a44" stroke-width="1.5"/>
    <text x="104" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">每请求都渲染</text>
    <text x="104" y="204" text-anchor="middle" font-size="11.5" fill="#94a3b8">内容永远最新</text>
    <text x="104" y="222" text-anchor="middle" font-size="11.5" fill="#94a3b8">首屏要等服务端</text>
    <text x="104" y="240" text-anchor="middle" font-size="11.5" fill="#94a3b8">并发高时压力大</text>
    <rect x="200" y="134" width="160" height="128" rx="10" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="280" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#a78bfa">SSG</text>
    <line x1="216" y1="166" x2="344" y2="166" stroke="#1e2a44" stroke-width="1.5"/>
    <text x="280" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">构建时预生成</text>
    <text x="280" y="204" text-anchor="middle" font-size="11.5" fill="#94a3b8">访问速度最快</text>
    <text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#94a3b8">内容偏静态</text>
    <text x="280" y="240" text-anchor="middle" font-size="11.5" fill="#94a3b8">更新要重新构建</text>
    <rect x="376" y="134" width="160" height="128" rx="10" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="456" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#f97316">ISR</text>
    <line x1="392" y1="166" x2="520" y2="166" stroke="#1e2a44" stroke-width="1.5"/>
    <text x="456" y="186" text-anchor="middle" font-size="11.5" fill="#94a3b8">静态速度打底</text>
    <text x="456" y="204" text-anchor="middle" font-size="11.5" fill="#94a3b8">revalidate 秒数</text>
    <text x="456" y="222" text-anchor="middle" font-size="11.5" fill="#94a3b8">过期后增量再生</text>
    <text x="456" y="240" text-anchor="middle" font-size="11.5" fill="#94a3b8">快与新的折中</text>
    <text x="24" y="280" font-size="11" fill="#64748b">ISR = SSG 的壳，到期自动换新数据</text>
    <rect x="24" y="292" width="524" height="54" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="292" width="4" height="54" rx="2" fill="#a78bfa"/>
    <text x="40" y="312" font-size="13.5" fill="#e2e8f0">SSR 图新、SSG 图快、ISR 折中；</text>
    <text x="40" y="331" font-size="13.5" fill="#94a3b8">revalidate 到期，下一次请求才再生。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：选型矩阵</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">四类页面，四张答案。</text>
    <rect x="24" y="134" width="524" height="34" rx="8" fill="#111a30" stroke="#223055"/>
    <rect x="34" y="147" width="8" height="8" rx="2" fill="#22d3ee"/>
    <text x="48" y="155" font-size="12.5" font-weight="bold" fill="#e2e8f0">新闻首页</text>
    <text x="534" y="155" text-anchor="end" font-size="11.5" fill="#94a3b8">SSG + ISR · 新内容定时再生</text>
    <rect x="24" y="176" width="524" height="34" rx="8" fill="#111a30" stroke="#223055"/>
    <rect x="34" y="189" width="8" height="8" rx="2" fill="#a78bfa"/>
    <text x="48" y="197" font-size="12.5" font-weight="bold" fill="#e2e8f0">用户仪表盘</text>
    <text x="534" y="197" text-anchor="end" font-size="11.5" fill="#94a3b8">SSR · 个性化数据实时出</text>
    <rect x="24" y="218" width="524" height="34" rx="8" fill="#111a30" stroke="#223055"/>
    <rect x="34" y="231" width="8" height="8" rx="2" fill="#f97316"/>
    <text x="48" y="239" font-size="12.5" font-weight="bold" fill="#e2e8f0">商品详情页</text>
    <text x="534" y="239" text-anchor="end" font-size="11.5" fill="#94a3b8">ISR · 量大 + 允许秒级延迟</text>
    <rect x="24" y="260" width="524" height="34" rx="8" fill="#111a30" stroke="#223055"/>
    <rect x="34" y="273" width="8" height="8" rx="2" fill="#f472b6"/>
    <text x="48" y="281" font-size="12.5" font-weight="bold" fill="#e2e8f0">帮助文档</text>
    <text x="534" y="281" text-anchor="end" font-size="11.5" fill="#94a3b8">SSG · 几乎不变，速度拉满</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">先问数据新鲜度，再问页面数量；</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">量越大，越要静态打底。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：两个高频坑</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="240" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">别被函数名骗了。</text>
    <rect x="24" y="146" width="250" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="163" font-size="11.5" font-weight="bold" fill="#f97316">坑：getServerSideProps 每请求都跑</text>
    <text x="38" y="192" font-size="12" fill="#94a3b8">重逻辑慎放，TTFB 会越拖越大</text>
    <rect x="24" y="212" width="220" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="229" font-size="11.5" font-weight="bold" fill="#f97316">坑：revalidate 是过期触发</text>
    <text x="38" y="258" font-size="12" fill="#94a3b8">不是定时器，等下个请求上门才再生</text>
    <rect x="24" y="286" width="524" height="66" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="66" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.5" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="40" y="328" font-size="13.5" fill="#e2e8f0">能用静态就尽量静态，</text>
    <text x="40" y="346" font-size="13.5" fill="#94a3b8">动态数据交给客户端 SWR 补充。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · ai-frontend-interview · EP.06</text>
</svg>
