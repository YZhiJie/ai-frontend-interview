<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.05</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">Node 事件循环</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">AI 前端面试漫画 · NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：0 毫秒的新对手</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="352" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">setImmediate 和</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">setTimeout(fn,0) 到底谁先跑？</text>
    <g transform="translate(52,196)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,177 74,183 88,189" fill="#f8fafc"/>
    <rect x="88" y="168" width="280" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="190" font-size="15" fill="#0b1220">谜底在 libuv 的六阶段里。</text>
    <rect x="24" y="214" width="524" height="76" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="236" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">setTimeout(fn, 0)  // timers</text>
    <text x="38" y="254" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">setImmediate(fn)   // check</text>
    <text x="38" y="272" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 主模块里：先后不确定？</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">浏览器只有一张宏任务队列，</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">Node 把循环切成了六个阶段。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">原理：libuv 六阶段</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="336" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">每圈按固定顺序跑六个阶段。</text>
    <rect x="32" y="134" width="508" height="26" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="46" y="152" font-size="12.5" font-weight="bold" fill="#22d3ee">timers 定时器</text>
    <text x="526" y="151" text-anchor="end" font-size="11.5" fill="#94a3b8">setTimeout · setInterval</text>
    <polygon points="286,162 280,168 292,168" fill="#64748b"/>
    <rect x="32" y="170" width="508" height="26" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="46" y="188" font-size="12.5" font-weight="bold" fill="#a78bfa">pending callbacks</text>
    <text x="526" y="187" text-anchor="end" font-size="11.5" fill="#94a3b8">上一轮漏掉的系统回调</text>
    <polygon points="286,198 280,204 292,204" fill="#64748b"/>
    <rect x="32" y="206" width="508" height="26" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.45"/>
    <text x="46" y="224" font-size="12.5" font-weight="bold" fill="#f472b6">poll 轮询</text>
    <text x="526" y="223" text-anchor="end" font-size="11.5" fill="#94a3b8">取 IO 事件 · 可等待新任务</text>
    <polygon points="286,234 280,240 292,240" fill="#64748b"/>
    <rect x="32" y="242" width="508" height="26" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.45"/>
    <text x="46" y="260" font-size="12.5" font-weight="bold" fill="#f97316">check 检查</text>
    <text x="526" y="259" text-anchor="end" font-size="11.5" fill="#94a3b8">setImmediate 专属舞台</text>
    <text x="46" y="286" font-size="11" fill="#64748b">↺ 另有 idle/prepare 与 close callbacks</text>
    <rect x="24" y="296" width="524" height="54" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="54" rx="2" fill="#a78bfa"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">一圈 = 六个阶段顺序跑完；</text>
    <text x="40" y="335" font-size="13.5" fill="#94a3b8">fs、加密重活进 libuv 线程池，不堵主线程。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：输出对比题</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="336" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">同一段代码，换个位置就变。</text>
    <rect x="24" y="134" width="524" height="158" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="156" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// ① 主模块直接跑</text>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">setTimeout(() =&gt; log('T'))</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">setImmediate(() =&gt; log('I'))</text>
    <text x="38" y="210" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 输出顺序：不确定！</text>
    <text x="38" y="228" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// ② 换到 IO 回调里再跑</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">fs.readFile(f, () =&gt; {</text>
    <text x="38" y="264" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  setTimeout(...); setImmediate(...)</text>
    <text x="38" y="282" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 恒定输出：I T</text>
    <rect x="24" y="304" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="304" width="4" height="50" rx="2" fill="#f472b6"/>
    <text x="40" y="324" font-size="13.5" fill="#e2e8f0">IO 回调执行在 poll 阶段，</text>
    <text x="40" y="343" font-size="13.5" fill="#94a3b8">下一站就是 check，I 恒定先跑。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：两个高频坑</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="310" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">nextTick 才是真正的插队王。</text>
    <rect x="24" y="146" width="210" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="163" font-size="11.5" font-weight="bold" fill="#f97316">坑：主模块里两者顺序不确定</text>
    <text x="38" y="192" font-size="12" fill="#94a3b8">IO 回调内 setImmediate 恒先</text>
    <rect x="24" y="212" width="230" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="229" font-size="11.5" font-weight="bold" fill="#f97316">坑：process.nextTick 优先级最高</text>
    <text x="38" y="258" font-size="12" fill="#94a3b8">最高优先级，滥用会饿死事件循环</text>
    <rect x="24" y="286" width="524" height="66" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="66" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.5" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="40" y="328" font-size="13.5" fill="#e2e8f0">IO 阶段后紧接 check 阶段，</text>
    <text x="40" y="346" font-size="13.5" fill="#94a3b8">所以 IO 回调里 setImmediate 稳定先执行。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · ai-frontend-interview · EP.05</text>
</svg>
