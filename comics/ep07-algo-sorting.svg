<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.07</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">排序复杂度之旅</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">AI 前端面试漫画 · NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：十万条卡死了</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">十万条数据用冒泡排序，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">页面直接卡死了！</text>
    <g transform="translate(52,196)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,177 74,183 88,189" fill="#f8fafc"/>
    <rect x="88" y="168" width="330" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="190" font-size="15" fill="#0b1220">O(n²) 正在替你烧 CPU。</text>
    <rect x="24" y="214" width="524" height="76" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="236" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">bubbleSort(arr)  // O(n²)</text>
    <text x="38" y="254" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">n = 100000       // 十万条</text>
    <text x="38" y="272" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 比较次数 ≈ 100 亿次</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">数据量一大，复杂度不再是考点，</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">而是实打实的线上体验。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">原理：两个数量级</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="360" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">同一份数据，比较次数差 6000 倍。</text>
    <text x="170" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f472b6">≈ 100 亿次</text>
    <rect x="130" y="152" width="80" height="100" rx="4" fill="#22d3ee" opacity="0.65"/>
    <text x="170" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22d3ee">O(n²) 冒泡</text>
    <text x="370" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#34d399">≈ 170 万次</text>
    <rect x="340" y="244" width="80" height="8" rx="3" fill="#34d399" opacity="0.85"/>
    <text x="370" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34d399">O(n log n) 快排</text>
    <line x1="70" y1="253" x2="530" y2="253" stroke="#64748b" stroke-width="1.5"/>
    <text x="286" y="292" text-anchor="middle" font-size="11" fill="#64748b">十万条数据：100 亿次 vs 170 万次</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">量级差一档，体感差一生；</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">10 万条：分钟级 vs 毫秒级。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：快排分家术</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">快排是怎么分家的？</text>
    <rect x="60" y="140" width="34" height="34" rx="6" fill="#111a30" stroke="#f97316" stroke-width="2"/>
    <text x="77" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">5</text>
    <rect x="99" y="140" width="34" height="34" rx="6" fill="#111a30" stroke="#223055"/>
    <text x="116" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">1</text>
    <rect x="138" y="140" width="34" height="34" rx="6" fill="#111a30" stroke="#223055"/>
    <text x="155" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">8</text>
    <rect x="177" y="140" width="34" height="34" rx="6" fill="#111a30" stroke="#223055"/>
    <text x="194" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">3</text>
    <rect x="216" y="140" width="34" height="34" rx="6" fill="#111a30" stroke="#223055"/>
    <text x="233" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">9</text>
    <rect x="255" y="140" width="34" height="34" rx="6" fill="#111a30" stroke="#223055"/>
    <text x="272" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">2</text>
    <text x="77" y="194" text-anchor="middle" font-size="11" fill="#f97316">基准 = 首位 5</text>
    <polygon points="174,198 167,210 181,210" fill="#64748b"/>
    <rect x="60" y="216" width="158" height="32" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="139" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">[1 3 2] 比 5 小</text>
    <rect x="230" y="216" width="54" height="32" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.6"/>
    <text x="257" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#f97316">5</text>
    <rect x="296" y="216" width="158" height="32" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="375" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">[8 9] 比 5 大</text>
    <text x="60" y="264" font-size="11" fill="#64748b">↺ 左右两段各自递归，直到不可再分</text>
    <text x="60" y="286" font-size="11.5" font-weight="bold" fill="#f97316">⚠ 已有序 + 固定首位基准 → 退化 O(n²)</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">一次 partition 甩对两边，</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">n log n 的效率是「甩」出来的。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：两个高频坑</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">快排也不是免死金牌。</text>
    <rect x="24" y="146" width="180" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="163" font-size="11.5" font-weight="bold" fill="#f97316">坑：快排最坏 O(n²)</text>
    <text x="38" y="192" font-size="12" fill="#94a3b8">已有序 + 固定基准；随机化可防</text>
    <rect x="24" y="212" width="240" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="229" font-size="11.5" font-weight="bold" fill="#f97316">坑：V8 Array.sort 用 TimSort</text>
    <text x="38" y="258" font-size="12" fill="#94a3b8">归并 + 插入混合，且是稳定排序</text>
    <rect x="24" y="286" width="524" height="66" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="66" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.5" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="40" y="328" font-size="13.5" fill="#e2e8f0">先看数据规模与有序度，</text>
    <text x="40" y="346" font-size="13.5" fill="#94a3b8">再选算法：小数据不必炫技。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · ai-frontend-interview · EP.07</text>
</svg>
