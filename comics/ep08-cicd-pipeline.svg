<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.08</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">CI/CD 流水线</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">AI 前端面试漫画 · NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：周五手抖之夜</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">周五手工部署手一抖，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">传错文件，线上炸了！</text>
    <g transform="translate(52,196)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,177 74,183 88,189" fill="#f8fafc"/>
    <rect x="88" y="168" width="320" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="190" font-size="15" fill="#0b1220">手工发布 = 每次都在赌。</text>
    <rect x="24" y="214" width="524" height="76" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="236" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ scp ./dist server:/var/www  # 手抖</text>
    <text x="38" y="254" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ ssh prod "pm2 restart all"</text>
    <text x="38" y="272" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 想回滚？制品都没留档</text>
    <rect x="24" y="302" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">重复的事交给人肉，</text>
    <text x="40" y="341" font-size="13.5" fill="#94a3b8">事故只是时间问题。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">原理：五站流水线</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="340" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">push 一响，机器接管一切。</text>
    <rect x="24" y="140" width="88" height="44" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="68" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22d3ee">push 代码</text>
    <polygon points="116,156 116,168 128,162" fill="#64748b"/>
    <rect x="132" y="140" width="88" height="44" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="176" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a78bfa">门禁</text>
    <polygon points="224,156 224,168 236,162" fill="#64748b"/>
    <rect x="240" y="140" width="88" height="44" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="284" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f472b6">构建</text>
    <polygon points="332,156 332,168 344,162" fill="#64748b"/>
    <rect x="348" y="140" width="88" height="44" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="392" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f97316">制品入库</text>
    <polygon points="440,156 440,168 452,162" fill="#64748b"/>
    <rect x="456" y="140" width="88" height="44" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="500" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34d399">自动部署</text>
    <text x="68" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">git push</text>
    <text x="176" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">lint · test · typecheck</text>
    <text x="284" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">npm run build</text>
    <text x="392" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">版本化存储</text>
    <text x="500" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">蓝绿 / 金丝雀</text>
    <rect x="132" y="222" width="380" height="30" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.55"/>
    <text x="322" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">任一站红灯 → 流水线立刻拦截，不进主干</text>
    <text x="286" y="272" text-anchor="middle" font-size="11" fill="#64748b">每一站都有日志，出问题顺着链路查</text>
    <rect x="24" y="290" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="56" rx="2" fill="#a78bfa"/>
    <text x="40" y="311" font-size="13.5" fill="#e2e8f0">代码过完五站才准上线，</text>
    <text x="40" y="330" font-size="13.5" fill="#94a3b8">任何一站红灯都拦在门外。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：两种发布策略</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="320" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">蓝绿和金丝雀怎么选？</text>
    <line x1="283" y1="140" x2="283" y2="252" stroke="#1e2a44" stroke-width="1.5"/>
    <text x="40" y="152" font-size="13" font-weight="bold" fill="#22d3ee">蓝绿部署</text>
    <rect x="40" y="162" width="100" height="32" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="90" y="183" text-anchor="middle" font-size="12" fill="#e2e8f0">绿 · 旧版</text>
    <text x="143" y="184" font-size="14" fill="#64748b">⇄</text>
    <rect x="164" y="162" width="100" height="32" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="214" y="183" text-anchor="middle" font-size="12" fill="#e2e8f0">蓝 · 新版</text>
    <text x="40" y="216" font-size="11.5" fill="#94a3b8">路由一键整体切换，</text>
    <text x="40" y="234" font-size="11.5" fill="#94a3b8">秒级回滚：把路由切回去。</text>
    <text x="300" y="152" font-size="13" font-weight="bold" fill="#f472b6">金丝雀灰度</text>
    <rect x="336" y="158" width="34" height="12" rx="3" fill="#f472b6" opacity="0.85"/>
    <text x="376" y="169" font-size="11" fill="#94a3b8">1%</text>
    <rect x="336" y="176" width="90" height="12" rx="3" fill="#f472b6" opacity="0.7"/>
    <text x="432" y="187" font-size="11" fill="#94a3b8">10%</text>
    <rect x="336" y="194" width="170" height="12" rx="3" fill="#f472b6" opacity="0.55"/>
    <text x="512" y="205" font-size="11" fill="#94a3b8">100%</text>
    <text x="300" y="216" font-size="11.5" fill="#94a3b8">小流量验证，逐步放量，</text>
    <text x="300" y="234" font-size="11.5" fill="#94a3b8">出问题只炸 1% 的用户。</text>
    <rect x="24" y="290" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="56" rx="2" fill="#f472b6"/>
    <text x="40" y="311" font-size="13.5" fill="#e2e8f0">蓝绿求快，金丝雀求稳，</text>
    <text x="40" y="330" font-size="13.5" fill="#94a3b8">按业务的容错预算来选。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：两个高频坑</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">这两个词，别再混着用。</text>
    <rect x="24" y="146" width="180" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="163" font-size="11.5" font-weight="bold" fill="#f97316">坑：金丝雀 ≠ 蓝绿</text>
    <text x="38" y="192" font-size="12" fill="#94a3b8">金丝雀按流量灰度，蓝绿整套环境切换</text>
    <rect x="24" y="212" width="240" height="26" rx="13" fill="#f97316" opacity="0.14" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="38" y="229" font-size="11.5" font-weight="bold" fill="#f97316">坑：回滚快不快，看制品版本化</text>
    <text x="38" y="258" font-size="12" fill="#94a3b8">制品按版本入库，才谈得上秒级回滚</text>
    <rect x="24" y="286" width="524" height="66" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="66" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.5" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="40" y="328" font-size="13.5" fill="#e2e8f0">让机器做重复的事，</text>
    <text x="40" y="346" font-size="13.5" fill="#94a3b8">让人做审查的事。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · ai-frontend-interview · EP.08</text>
</svg>
